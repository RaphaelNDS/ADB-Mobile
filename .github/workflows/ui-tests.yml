# Testes de tela (androidTest) num emulador Android 15, em cada PR e push no master.
# Só há o emulador no runner, então o connectedDebugAndroidTest é seguro aqui (nunca rode
# esse comando no PC com o tablet ou o Zebra conectados: ele desinstala o app).
name: Testes de tela

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes no emulador (Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-de-tela
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
