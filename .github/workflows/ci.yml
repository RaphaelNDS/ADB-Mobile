# Testes de unidade, lint e R8 em cada PR e em cada push no master.
# Não precisa da chave de assinatura: nada aqui gera o APK assinado.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: ./gradlew testReleaseUnitTest

      - name: Lint
        run: ./gradlew lintRelease

      # Confere as regras do R8 (proguard-rules.pro) sem assinar o APK.
      - name: R8
        run: ./gradlew minifyReleaseWithR8

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
