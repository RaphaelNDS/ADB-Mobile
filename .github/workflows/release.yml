# Release automático: ao enviar uma tag vX.Y (ex.: git tag v2.35 && git push origin v2.35),
# gera o APK assinado e publica o release com ele.
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    conteúdo de adb-mobile-release.jks em base64
#   KEYSTORE_PASSWORD  senha do arquivo (storePassword do keystore.properties)
#   KEY_ALIAS          keyAlias do keystore.properties
#   KEY_PASSWORD       keyPassword do keystore.properties
# Notas: release-notes/vX.Y.md se existir; senão, as geradas pelo GitHub a partir dos PRs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64 (veja o começo deste arquivo)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Versão do app igual à tag
        run: |
          app=$(grep -oP "versionName = '\K[^']+" app/build.gradle)
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag é $GITHUB_REF_NAME, mas o app está na versão $app (app/build.gradle)."
            exit 1
          fi

      - name: Testes, lint e APK assinado
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="ADB-Mobile-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$apk" --title "ADB Mobile ${GITHUB_REF_NAME#v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "ADB Mobile ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Apagar a chave
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
