plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bkp.adbmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bkp.adbmobile'
        minSdk 21
        targetSdk 34
        versionCode 21
        versionName '2.19'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Cliente ADB (pareamento + conexão TLS com a "Depuração sem fio" do próprio aparelho)
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Geração do certificado X.509 usado pelo cliente ADB
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'

    // Testes de unidade (JVM): JUnit e a org.json real (a do android.jar só tem stubs)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Teste instrumentado de abertura (roda no aparelho)
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
