plugins {
    id 'com.android.application'
}

// Chave de assinatura do release: keystore.properties e adb-mobile-release.jks na raiz do projeto,
// os dois fora do git (o repositório é público). Sem eles o APK de release NÃO é gerado: assinar
// com outra chave impediria atualizar o app já instalado.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'com.bkp.adbmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bkp.adbmobile'
        minSdk 21
        targetSdk 35
        versionCode 36
        versionName '2.34'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8: tira o código não usado das bibliotecas (regras em proguard-rules.pro).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                         // Tabelas do algoritmo pós-quântico Picnic (1,2 MB): o app não usa.
                         'org/bouncycastle/pqc/**']
        }
    }

    lint {
        // Erro do lint para o build (os avisos que não se aplicam estão em lint.xml).
        lintConfig file('lint.xml')
        abortOnError true
        checkReleaseBuilds true
        checkDependencies false
    }
}

dependencies {
    // Cliente ADB (pareamento + conexão TLS com a "Depuração sem fio" do próprio aparelho)
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Geração do certificado X.509 usado pelo cliente ADB
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'

    // Testes de unidade (JVM): JUnit e a org.json real (a do android.jar só tem stubs)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Teste instrumentado de abertura (roda no aparelho)
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Falha cedo e com explicação se faltar a chave (em vez de gerar um APK sem assinatura).
gradle.taskGraph.whenReady { graph ->
    if (!keystoreFile.exists() && graph.allTasks.any { it.name == 'packageRelease' }) {
        throw new GradleException('Falta keystore.properties na raiz do projeto (chave de release). ' +
                'Veja o modelo em keystore.properties.example.')
    }
}
